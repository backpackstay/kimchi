<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>김장대첩 참가자 안내</title>
<meta name="description" content="백패커 김장대첩 일정과 공지사항">
<meta name="theme-color" content="#1B1B1B">
<!-- 홈 화면에 추가했을 때 앱처럼 열리도록 하는 설정 (아이콘·manifest 파일을 같은 저장소에 함께 올려 주세요) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="김장대첩">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 바탕은 휴대폰 설정(라이트/다크 모드)과 상관없이 항상 블랙 톤으로 고정 */
:root{
  --bg:#151412; --surface:#1F1D1A; --surface-2:#2A2724; --ink:#F4F0E8; --muted:#A9A196; --line:#39352F;
  --accent:#FF7A3D; --accent-soft:#3A2418; --pin:#382E14;
  --display:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Pretendard","Malgun Gothic",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* 머리글 */
.top{background:#1B1B1B;color:#FFFAEC;padding:calc(20px + env(safe-area-inset-top)) 0 18px}
.eyebrow{font:600 11.5px var(--mono);letter-spacing:.08em;color:#FF8A57}
h1{font:400 clamp(28px,8vw,42px)/1.1 var(--display);margin:6px 0 12px;letter-spacing:-.01em;word-break:keep-all}
/* 라벨 칸은 가장 긴 라벨(예: 비상연락망)에 맞춰 자동으로 넓어지고, 내용은 같은 줄에서 시작 */
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px;margin:0;padding:0;list-style:none;font-size:14px}
.facts li{display:contents}
.facts b{color:#FF8A57;font-weight:500;white-space:nowrap}
.facts span{color:#FFFAEC;word-break:keep-all;overflow-wrap:anywhere}

/* 탭 */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px}
.tab{flex:1;border:0;background:none;padding:13px 6px 11px;font:700 15px var(--body);color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.tab small{display:block;font:500 11.5px var(--mono);color:var(--muted)}
main{padding:16px 0 calc(48px + env(safe-area-inset-bottom))}

/* 공지 */
.sec-h{font:400 22px var(--display);margin:22px 0 10px}
.notes{display:grid;gap:10px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.note.pin{background:var(--pin);border-color:transparent}
.note h3{margin:0 0 4px;font-size:15.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.note p{margin:0;font-size:14px;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.note .d{font:500 11.5px var(--mono);color:var(--muted);margin-left:auto}
.tag{font:700 11px var(--body);background:var(--accent);color:#fff;border-radius:5px;padding:1px 6px}

/* 일정 */
.now{display:none;margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--accent);color:#fff}
.now.on{display:block}
.now b{display:block;font-size:16px}
.now small{opacity:.9}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:52px;top:8px;bottom:8px;width:2px;background:var(--line)}
.it{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:8px 0;position:relative}
.it::before{content:"";position:absolute;left:48px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.it.cur::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.it.past{opacity:.45}
.t{font:600 14px var(--mono);font-variant-numeric:tabular-nums;padding-top:9px;text-align:right}
.t small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px;margin-left:8px;min-width:0}
/* ── 지금 시간 하이라이트 ── */
/* 지금 진행 중인 프로그램: 굵은 주황 테두리 + 연한 주황 바탕 + 은은하게 깜빡이는 빛 */
.it.cur .card{border:2.5px solid var(--accent);background:var(--accent-soft);padding:9px 11px 9px 13px;animation:nowglow 2.2s ease-in-out infinite}
.it.cur .t{color:var(--accent)}
.it.cur::before{width:14px;height:14px;left:46px;top:15px;animation:nowdot 1.4s ease-in-out infinite}
@keyframes nowglow{0%,100%{box-shadow:0 0 0 0 rgba(255,95,24,.35)}50%{box-shadow:0 0 0 7px rgba(255,95,24,0)}}
@keyframes nowdot{0%,100%{box-shadow:0 0 0 3px var(--accent-soft)}50%{box-shadow:0 0 0 8px rgba(255,95,24,.12)}}
/* 프로그램 사이 쉬는 시간: 다음 프로그램을 점선 테두리로 */
.it.next .card{border:2px dashed var(--accent)}
.it.next::before{border-color:var(--accent)}
.live{display:inline-flex;align-items:center;gap:5px;font:700 11.5px var(--body);color:#fff;background:var(--accent);border-radius:999px;padding:1px 9px 1px 7px;margin:0 0 4px 4px;vertical-align:1px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s ease-in-out infinite}
.live.soon{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.live.soon::before{background:var(--accent);animation:none}
@keyframes blink{50%{opacity:.25}}
/* 오늘에 해당하는 일차 탭 · 제목 */
.tab.today{color:var(--accent)}
.tab.today small{display:inline-block;margin-top:2px;color:#fff;background:var(--accent);border-radius:999px;padding:0 8px;font-family:var(--body);font-weight:700}
.tab.today[aria-selected=true]{color:var(--ink)}
.sec-h .today-tag{display:inline-block;margin-left:8px;font:700 12px var(--body);color:#fff;background:var(--accent);border-radius:999px;padding:2px 9px;vertical-align:4px}
@media (prefers-reduced-motion:reduce){.it.cur .card,.it.cur::before,.live::before{animation:none}}
.chip{display:inline-block;font-size:11.5px;font-weight:500;border-radius:999px;padding:0 8px;background:var(--surface-2);color:var(--muted);margin-bottom:3px}
.card h3{margin:0;font-size:16px;line-height:1.35;word-break:keep-all}
.place{font-size:13px;color:var(--muted);margin-top:2px}
.desc{font-size:13.5px;margin:4px 0 0;word-break:keep-all;overflow-wrap:anywhere}

.msg{margin:14px 0;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:8px 0 24px}
[hidden]{display:none!important}

/* 지도: 두 손가락 확대, 한 손가락 끌기, 두 번 탭 확대 */
.map{position:relative;height:calc(100svh - 250px);min-height:360px;overflow:hidden;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.map.drag{cursor:grabbing}
.map img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;-webkit-user-drag:none;will-change:transform;visibility:hidden}
.map.ready img{visibility:visible}
.map-ctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.map-ctl button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 20px/1 var(--body);box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer}
.map-hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(27,27,27,.75);color:#FFFAEC;font-size:12.5px;padding:5px 11px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.map-hint.off{opacity:0}
.map-err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:14px}
.map-sub{margin:10px 2px 0;font-size:13px;color:var(--muted)}
.map-sub a{color:var(--accent)}
/* 지도 범례 · 미션 팝업 (운영진 보드와 같은 디자인) */
.map-legend .row{display:contents}
.map-legend{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:7px 12px;margin:10px 2px 0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;color:var(--ink)}
.map-legend .dots{display:flex;align-items:center;margin:0 -6px}
.map-legend .lg{display:inline-flex;align-items:center;justify-content:center;padding:10px 6px;margin:-10px 0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.map-legend .lg:active .dot,.map-legend .lg:focus-visible .dot{transform:scale(1.35)}
.map-legend .lg .dot{transition:transform .12s}
.map-legend .lg{width:23px;padding:10px 0;flex:none}
.map-legend .lgs{font:inherit;color:inherit}
.svgemo{width:1.15em;height:1.15em;display:block}
.emo{display:inline-flex;align-items:center;justify-content:center}
.map-legend .lgs .emo{transition:transform .12s}
.map-legend .lgs:active .emo,.map-legend .lgs:focus-visible .emo{transform:scale(1.25)}
.map-legend .tip{grid-column:1/-1;justify-self:end;font-size:12px;color:var(--muted);margin-top:-2px}
/* 미션 팝업: 세로형 카드 (위 이미지 3:4 + 아래 미션 이름) */
.map-pop-bg{position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.5)}
.map-pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;box-sizing:border-box;width:min(340px,calc(100vw - 40px),calc((100svh - 150px) * .75));display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--surface);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.35);animation:mappop .16s ease-out}
.map-pop[hidden],.map-pop-bg[hidden]{display:none}
.map-pop .pimg{position:relative;aspect-ratio:3/4;background:var(--surface-2);overflow:hidden}
.map-pop .pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.map-pop .pimg .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px}
.map-pop .pimg .ph .big{font-size:56px;line-height:1}
.map-pop .pimg .ph .big .svgemo{width:64px;height:64px}
.map-pop .pimg .ph .dot{width:56px;height:56px}
.map-pop .pcap{display:flex;align-items:flex-start;gap:9px;padding:12px 14px 6px;font-size:16px;font-weight:700;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.map-pop .pcap .emo,.map-pop .pcap .dot{margin-top:3px}
.map-pop .pdesc{margin:0;padding:0 14px 8px 14px;font-size:14px;line-height:1.5;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.map-pop .pclose{padding:0 14px 12px;font-size:12px;color:var(--muted)}
.map-pop .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
@keyframes mappop{from{opacity:0;transform:translate(-50%,-47%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.map-pop{animation:none}.map-legend .lg .dot{transition:none}}
.map-legend .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.map-legend .emo{font-size:13px;line-height:1}
.map-legend .cap{color:var(--ink)}

/* 인트로 (영상 파일 대신 페이지가 직접 그리는 애니메이션 — 휴대폰·카톡 브라우저에서도 동작) */
#intro{position:fixed;inset:0;z-index:100;background:#1B1B1B;overflow:hidden;transition:opacity .7s ease .1s}
#intro.end{background:#FF5F18}
#intro.end #st{opacity:0;transition:opacity .15s}
#intro.out{opacity:0;pointer-events:none}
#st{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px;transform-origin:50% 50%}
#st .glow{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(255,95,24,.10),rgba(0,0,0,0) 55%)}
#st .g{position:absolute;left:0;top:0;width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;will-change:transform}
#st .eb{font:600 40px var(--mono);letter-spacing:.3em;margin-right:-.3em;color:#FF8A57;opacity:0}
#st .tt{font:400 232px/1.05 var(--display);color:#FFFAEC;margin:22px 0 30px;letter-spacing:-.01em;opacity:0;white-space:nowrap}
#st .br{height:20px;width:0;background:#FF5F18;border-radius:2px}
#st .sb{font:600 30px var(--mono);letter-spacing:.22em;margin:34px -.22em 0 0;color:#B8B0A2;opacity:0;white-space:nowrap}
#st .ov{position:absolute;inset:0;background:#FF5F18;opacity:0}
#skip{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));border:1px solid rgba(255,250,236,.35);background:rgba(27,27,27,.4);color:#FFFAEC;border-radius:999px;padding:7px 14px;font:500 13px var(--body);cursor:pointer}
html.intro-on{overflow:hidden}
html.intro-on .top,html.intro-on .bar,html.intro-on main,html.intro-on footer{opacity:0;transform:scale(1.08)}
html.intro-reveal .top,html.intro-reveal .bar,html.intro-reveal main,html.intro-reveal footer{transition:opacity .8s ease,transform 1s cubic-bezier(.2,.7,.2,1);transform-origin:50% 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 홈 화면에 앱으로 추가하기 공지 */
.appnote{background:var(--pin);border-radius:12px;padding:12px 14px;margin-top:14px}
.appnote>summary{list-style:none;cursor:pointer;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-weight:700;font-size:15.5px}
.appnote>summary::-webkit-details-marker{display:none}
.appnote>summary .fold{margin-left:auto;font:500 12.5px var(--body);color:var(--muted)}
.appnote[open]>summary .fold::after{content:"접기 ▲"}
.appnote:not([open])>summary .fold::after{content:"펼치기 ▼"}
.appnote .why{margin:4px 0 10px;font-size:14px;word-break:keep-all}
.os{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:10px}
.os button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font:700 14px var(--body);color:var(--muted);cursor:pointer}
.os button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
.steps>li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;word-break:keep-all;overflow-wrap:anywhere}
.steps>li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:700 12px/22px var(--body);text-align:center;margin-top:1px}
.steps>li.pre::before{content:"!";background:var(--ink);color:var(--bg)}
.steps b{font-weight:700}
.steps .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.key{display:inline-block;min-width:1.6em;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 5px;font:600 13px/1.5 var(--body);white-space:nowrap}
.br2{display:grid;gap:6px;margin-top:6px}
.br2>div{background:var(--surface);border-radius:9px;padding:8px 10px}
.br2 .lb{display:block;font-weight:700;font-size:13px;margin-bottom:2px}
.steps>li.pre{counter-increment:none}
.ext{display:flex;width:max-content;align-items:center;gap:6px;margin-top:6px;border:0;background:var(--ink);color:var(--bg);border-radius:9px;padding:8px 12px;font:700 13.5px var(--body);cursor:pointer}
.appnote .done{margin:10px 0 0;font-size:13px;color:var(--muted)}
.appnote+.notes,.appnote+.empty{margin-top:12px}
</style>
</head>
<body>

<!-- 인트로: 처음 들어왔을 때 한 번만 로고 연출(약 3초)을 보여주고, 줌인되며 공지 화면으로 넘어갑니다.
     로고 글자를 바꾸려면 아래 eb(위 작은 글씨) · tt(큰 글씨) · sb(아래 작은 글씨) 안의 글자를 고치면 됩니다. -->
<div id="intro" hidden>
  <div id="st" aria-hidden="true">
    <div class="glow"></div>
    <div class="g"><div class="eb">BACKPACK STAY</div><div class="tt">김장대첩</div><div class="br"></div><div class="sb">2026 · KIMCHI ROAD TRAIL</div></div>
    <div class="ov"></div>
  </div>
  <button id="skip" type="button">건너뛰기</button>
</div>
<script>
(function () {
  var html = document.documentElement, box = document.getElementById("intro"), st = document.getElementById("st");
  var force = /[?&]intro\b/.test(location.search);
  var seen = false, reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  try { seen = sessionStorage.getItem("kj-intro") === "1"; } catch (e) {}
  if (!force && (seen || reduce || /[?&]nointro\b/.test(location.search))) { box.remove(); return; }
  try { sessionStorage.setItem("kj-intro", "1"); } catch (e) {}
  box.hidden = false; html.classList.add("intro-on");
  var done = false;
  var q = function (c) { return st.querySelector(c); };
  var g = q(".g"), eb = q(".eb"), tt = q(".tt"), br = q(".br"), sb = q(".sb"), glow = q(".glow"), ov = q(".ov");
  var cl = function (x, a, b) { return Math.min(1, Math.max(0, (x - a) / (b - a))); };
  var eo = function (x) { return 1 - Math.pow(1 - x, 3); }, ei = function (x) { return x * x * x * x; };
  function fit() { st.style.transform = "scale(" + Math.max(innerWidth / 1080, innerHeight / 1920) + ")"; }
  fit(); addEventListener("resize", fit);
  function frame(t) {
    var a = eo(cl(t, 0, .6)), b = eo(cl(t, .3, 1)), s = eo(cl(t, .5, 1.1)), f = 1 - cl(t, 2, 2.35);
    tt.style.opacity = a; tt.style.transform = "translateY(" + (1 - a) * 24 + "px)";
    eb.style.opacity = cl(t, .15, .7) * f; sb.style.opacity = s * f;
    br.style.width = 440 * b + "px";
    glow.style.opacity = cl(t, .4, 1.4);
    var sc = (1 + .05 * cl(t, .6, 2)) * (1 + ei(cl(t, 2, 2.8)) * 110);
    g.style.transform = "scale(" + sc + ")";
    ov.style.opacity = cl(t, 2.55, 2.8);
  }
  function run() {
    if (done) return;
    br.style.width = "440px";
    g.style.transformOrigin = "540px " + (br.offsetTop + br.offsetHeight / 2) + "px";
    var t0 = null;
    (function tick(now) {
      if (done) return;
      if (t0 === null) t0 = now;
      var t = (now - t0) / 1000;
      frame(t);
      if (t >= 2.85) reveal(); else requestAnimationFrame(tick);
    })(performance.now());
  }
  /* 글꼴이 준비되면 시작 (늦어도 1.2초 안에 시작) */
  var started = false;
  function go() { if (!started) { started = true; requestAnimationFrame(run); } }
  try { Promise.all([document.fonts.load('400 232px "Black Han Sans"', "김장대첩"), document.fonts.load('600 40px "IBM Plex Mono"', "BACKPACK")]).then(go, go); } catch (e) { go(); }
  setTimeout(go, 1200);
  function reveal() {
    if (done) return; done = true;
    box.classList.add("end");
    html.classList.add("intro-reveal");
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      html.classList.remove("intro-on");
      box.classList.add("out");
      setTimeout(function () { box.remove(); html.classList.remove("intro-reveal"); }, 1100);
    }); });
  }
  document.getElementById("skip").addEventListener("click", reveal);
  setTimeout(reveal, 7000); /* 어떤 이유로 멈춰도 7초 뒤엔 화면을 보여줌 */
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";

  /* schedule.xlsx를 못 읽을 때(예: PC에서 파일을 더블클릭해 열었을 때) 보여줄 예비 데이터 */
  var FALLBACK = {
    info: [["행사명","2026 백패커 김장대첩"],["부제","BACKPACK STAY · 김치로드트레일"],["날짜","2026. 11. 28.(토) ~ 11. 29.(일) 1박 2일"],["장소","샘플 오토캠핑장"],["1일차 날짜","2026-11-28"],["2일차 날짜","2026-11-29"]],
    items: [{day:1,start:"10:30",end:"11:00",session:"오프닝",title:"집결 · 체크인",place:"관리동 앞",desc:"예비 데이터입니다. GitHub에 올리면 schedule.xlsx 내용이 보입니다."}],
    notes: []
  };

  var $ = function (id) { return document.getElementById(id); };
  var D = { info: {}, infoOrder: [], items: [], notes: [] };
  var view = "notice";
  var HEAD_KEYS = ["행사명", "부제", "1일차 날짜", "2일차 날짜"];

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* 엑셀에서 10:30을 입력하면 시간(숫자)으로 바뀌므로 둘 다 처리 */
  function toTime(v) {
    if (v == null || v === "") return "";
    if (typeof v === "number") { var m = Math.round((v % 1) * 1440); return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
    var s = String(v).trim(), r = s.match(/^(\d{1,2})\s*[:시.]\s*(\d{2})?/);
    return r ? pad(+r[1]) + ":" + (r[2] || "00") : s;
  }
  function toDate(v) {
    if (v == null || v === "") return "";
    if (typeof v === "number") { var d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()); }
    var r = String(v).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    return r ? r[1] + "-" + pad(+r[2]) + "-" + pad(+r[3]) : "";
  }
  function mins(t) { var r = /^(\d{2}):(\d{2})$/.exec(t); return r ? +r[1] * 60 + +r[2] : null; }

  function load(info, items, notes) {
    D.info = {}; D.infoOrder = [];
    info.forEach(function (r) { var k = String(r[0] || "").trim(); if (!k) return; D.info[k] = r[1] == null ? "" : r[1]; D.infoOrder.push(k); });
    D.items = items.filter(function (i) { return i.title; }).map(function (i) {
      return { day: +i.day === 2 ? 2 : 1, start: toTime(i.start), end: toTime(i.end), session: i.session || "", title: i.title, place: i.place || "", desc: i.desc || "" };
    }).sort(function (a, b) { return a.day - b.day || a.start.localeCompare(b.start); });
    D.notes = notes.filter(function (n) { return n.title || n.body; }).map(function (n, k) {
      return { pin: /^(o|ㅇ|y|yes|중요|v|✓|1|true)$/i.test(String(n.pin || "").trim()), title: n.title || "", body: n.body || "", date: toDate(n.date) || String(n.date || ""), k: k };
    }).sort(function (a, b) { return (b.pin - a.pin) || String(b.date).localeCompare(String(a.date)) || a.k - b.k; });
  }

  function fromWorkbook(wb) {
    function rows(name) { var ws = wb.Sheets[name]; return ws ? XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true }) : []; }
    function objs(name, map) {
      var r = rows(name); if (!r.length) return [];
      var h = r[0].map(function (x) { return String(x).trim(); });
      return r.slice(1).map(function (row) { var o = {}; for (var key in map) { var i = h.indexOf(map[key]); o[key] = i < 0 ? "" : row[i]; } return o; });
    }
    load(rows("행사정보").slice(1),
         objs("일정", { day: "일차", start: "시작", end: "종료", session: "세션", title: "프로그램", place: "장소", desc: "설명" }),
         objs("공지", { pin: "중요", title: "제목", body: "내용", date: "게시일" }));
  }

  function dayDate(d) { return toDate(D.info[d + "일차 날짜"]); }
  /* 하이라이트 추가 기간: 이 기간에는 날짜가 행사일이 아니어도 아래 'day' 일차 시간표대로
     지금 진행 중인 프로그램을 표시합니다. (일차 날짜 표시는 11/28 · 11/29 그대로, '오늘' 표시는 안 붙음)
     기간을 바꾸려면 from · to 날짜만 고치고, 필요 없으면 from 을 "" 로 두세요. */
  var HIGHLIGHT_EXTRA = { from: "2026-11-15", to: "2026-11-25", day: 1 };
  function realToday() { var n = new Date(); return n.getFullYear() + "-" + pad(n.getMonth() + 1) + "-" + pad(n.getDate()); }
  function inExtra() { var t = realToday(); return !!HIGHLIGHT_EXTRA.from && t >= HIGHLIGHT_EXTRA.from && t <= HIGHLIGHT_EXTRA.to; }
  /* 하이라이트 계산에 쓰는 '오늘' (추가 기간이면 해당 일차 날짜로 봄) */
  function today() { return inExtra() ? dayDate(HIGHLIGHT_EXTRA.day) : realToday(); }
  function dayLabel(d) {
    var ds = dayDate(d); if (!ds) return d + "일차";
    var p = ds.split("-"), w = "일월화수목금토"[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
    return d + "일차 · " + (+p[1]) + "/" + (+p[2]) + "(" + w + ")";
  }
  /* 지금 진행 중(cur) / 지난 일정(past) / 아직 안 함("").
     종료 시간이 시작보다 이르면(예: 21:00~07:00) 다음 날 아침까지 진행 중으로 봅니다. */
  function addDay(ds) { var p = ds.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2] + 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function state(i) {
    var ds = dayDate(i.day), td = today(); if (!ds) return "";
    var n = new Date(), now = n.getHours() * 60 + n.getMinutes(), s = mins(i.start), e = mins(i.end);
    if (s == null) return ds < td ? "past" : "";
    if (e == null) e = s + 30;
    var over = e <= s;
    if (ds === td) return over ? (now >= s ? "cur" : "") : (now >= e ? "past" : now >= s ? "cur" : "");
    if (ds < td) return (over && addDay(ds) === td && now < e) ? "cur" : "past";
    return "";
  }
  /* 지금 진행 중인 게 없을 때(쉬는 시간) 오늘 바로 다음에 시작할 프로그램 */
  function nextItem() {
    if (D.items.some(function (i) { return state(i) === "cur"; })) return null;
    return D.items.filter(function (i) { return dayDate(i.day) === today() && state(i) === ""; })[0] || null;
  }
  /* 오늘이 몇 일차인지 (야영처럼 자정을 넘긴 일정이 진행 중이면 그 일차) */
  function todayDay() {
    var c = D.items.filter(function (i) { return state(i) === "cur"; })[0]; if (c) return c.day;
    return dayDate(1) === today() ? 1 : dayDate(2) === today() ? 2 : 0;
  }

  function renderHead() {
    $("name").textContent = D.info["행사명"] || "김장대첩";
    $("sub").textContent = D.info["부제"] || "";
    document.title = (D.info["행사명"] || "김장대첩") + " 참가자 안내";
    $("facts").innerHTML = D.infoOrder.filter(function (k) { return HEAD_KEYS.indexOf(k) < 0 && D.info[k] !== ""; })
      .map(function (k) { return "<li><b>" + esc(k) + "</b><span>" + esc(D.info[k]) + "</span></li>"; }).join("");
  }

  function renderTabs() {
    var days = [1, 2].filter(function (d) { return D.items.some(function (i) { return i.day === d; }); });
    var tabs = [{ v: "notice", t: "공지", s: D.notes.length ? D.notes.length + "건" : "" }].concat(days.map(function (d) {
      var ds = dayDate(d), p = ds ? ds.split("-") : null;
      return { v: "d" + d, t: d + "일차", s: p ? (+p[1]) + "/" + (+p[2]) : "" };
    })).concat([{ v: "map", t: "지도", s: "행사장" }]);
    if (!tabs.some(function (x) { return x.v === view; })) view = "notice";
    var tday = todayDay();
    $("tabs").innerHTML = tabs.map(function (x) {
      var isToday = tday && x.v === "d" + tday && !inExtra();
      return '<button class="tab' + (isToday ? " today" : "") + '" role="tab" type="button" data-v="' + x.v + '" aria-selected="' + (x.v === view) + '">' + esc(x.t) +
        (isToday ? "<small>오늘</small>" : x.s ? "<small>" + esc(x.s) + "</small>" : "") + "</button>";
    }).join("");
  }

  /* ── 홈 화면에 앱으로 추가하기 안내 (엑셀이 아니라 여기 글자를 고치면 바뀝니다) ── */
  var UA = navigator.userAgent || "";
  var IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var IS_ANDROID = /Android/i.test(UA);
  var IN_KAKAO = /KAKAOTALK/i.test(UA);
  var AS_APP = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  var appOs = IS_ANDROID ? "galaxy" : "iphone";
  var appOpen = true;
  try { appOpen = localStorage.getItem("kj-appnote-closed") !== "1"; } catch (e) {}

  function appNoteHtml() {
    if (AS_APP) return "";
    var ext = IN_KAKAO ? '<button type="button" class="ext" data-ext>' + (appOs === "iphone" ? "Safari로 열기" : "인터넷 앱으로 열기") + " ↗</button>" : "";
    var ios = '<ol class="steps">' +
      '<li class="pre"><span><b>카카오톡에서 열었다면 먼저 Safari로 열어 주세요.</b><span class="sub">카카오톡 화면 아래쪽 <span class="key">⋯</span> 또는 공유 <span class="key">⇧</span> 버튼 → \'Safari로 열기\'. 카카오톡 안에서는 홈 화면에 추가할 수 없어요.</span>' + ext + "</span></li>" +
      '<li><span>Safari 아래쪽 <span class="key">⋯</span> 버튼을 누르고 <b>공유</b> <span class="key">⇧</span>를 눌러요.<span class="sub">주소창 옆에 공유 <span class="key">⇧</span> 버튼이 바로 보이면 그걸 눌러도 돼요.</span></span></li>' +
      '<li><span>목록을 위로 밀어 <b>홈 화면에 추가</b>를 눌러요.<span class="sub">안 보이면 맨 아래 \'더 보기\' 또는 \'작업 편집\'에서 찾을 수 있어요.</span></span></li>' +
      '<li><span><b>웹 앱으로 열기</b>가 켜져 있는지 확인하고, 오른쪽 위 <b>추가</b>를 눌러요.</span></li>' +
      '<li><span>홈 화면에 생긴 <b>김장대첩</b> 아이콘을 누르면 앱처럼 열려요.</span></li></ol>';
    var gal = '<ol class="steps">' +
      '<li class="pre"><span><b>카카오톡에서 열었다면 먼저 인터넷 앱으로 열어 주세요.</b><span class="sub">카카오톡 화면 구석의 <span class="key">⋮</span> 버튼 → \'다른 브라우저로 열기\'. 카카오톡 안에서는 홈 화면에 추가할 수 없어요.</span>' + ext + "</span></li>" +
      '<li><span>쓰는 인터넷 앱에 맞춰 메뉴를 열어요.<div class="br2">' +
        '<div><span class="lb">삼성 인터넷</span>아래쪽 <span class="key">≡</span> 메뉴 → <b>현재 페이지 추가</b> → <b>홈 화면</b> 선택</div>' +
        '<div><span class="lb">크롬</span>오른쪽 위 <span class="key">⋮</span> 메뉴 → <b>홈 화면에 추가</b> (또는 \'앱 설치\')</div></div></span></li>' +
      '<li><span><b>추가</b>(또는 <b>설치</b>)를 눌러요.<span class="sub">\'홈 화면에 추가할까요?\'가 한 번 더 나오면 \'추가\'를 눌러 주세요.</span></span></li>' +
      '<li><span>홈 화면에 생긴 <b>김장대첩</b> 아이콘을 누르면 앱처럼 열려요.<span class="sub">아이콘이 안 보이면 홈 화면 맨 끝 페이지를 확인해 주세요.</span></span></li></ol>';
    return '<details class="appnote" id="appnote"' + (appOpen ? " open" : "") + '><summary><span class="tag">중요</span>📲 홈 화면에 앱으로 추가하기<span class="fold"></span></summary>' +
      '<p class="why">카카오톡에서 링크를 열면 이 페이지를 보는 동안 카톡을 쓸 수 없어요. 홈 화면에 한 번 추가해 두면 <b>앱처럼 따로 열려서</b> 카톡과 편하게 오갈 수 있어요.</p>' +
      '<div class="os" role="group" aria-label="휴대폰 종류"><button type="button" data-os="iphone" aria-pressed="' + (appOs === "iphone") + '">아이폰</button><button type="button" data-os="galaxy" aria-pressed="' + (appOs === "galaxy") + '">갤럭시</button></div>' +
      (appOs === "iphone" ? ios : gal) +
      '<p class="done">한 번만 해 두면 행사 내내 아이콘으로 바로 열 수 있어요. 내용은 열 때마다 최신으로 바뀌어요.</p></details>';
  }
  function openExternal() {
    var url = location.href.split("#")[0];
    location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url);
  }

  function noteHtml(n) {
    return '<article class="note' + (n.pin ? " pin" : "") + '"><h3>' + (n.pin ? '<span class="tag">중요</span>' : "") + esc(n.title) +
      (n.date ? '<span class="d">' + esc(n.date) + "</span>" : "") + "</h3><p>" + esc(n.body) + "</p></article>";
  }
  function itemHtml(i, nx) {
    var st = state(i), isNext = nx === i;
    var badge = st === "cur" ? '<span class="live">지금 진행 중</span>' : isNext ? '<span class="live soon">다음 일정</span>' : "";
    return '<li class="it ' + st + (isNext ? " next" : "") + '"><div class="t">' + esc(i.start) + (i.end ? "<small>~" + esc(i.end) + "</small>" : "") + "</div>" +
      '<div class="card">' + (i.session ? '<span class="chip">' + esc(i.session) + "</span>" : "") + badge + "<h3>" + esc(i.title) + "</h3>" +
      (i.place ? '<div class="place">📍 ' + esc(i.place) + "</div>" : "") + (i.desc ? '<p class="desc">' + esc(i.desc) + "</p>" : "") + "</div></li>";
  }

  function nowBanner() {
    var cur = D.items.filter(function (i) { return state(i) === "cur"; })[0];
    var next = D.items.filter(function (i) { return dayDate(i.day) === today() && state(i) === ""; })[0];
    if (!cur && !next) return "";
    var i = cur || next;
    return '<div class="now on"><small>' + (cur ? "지금 진행 중" : "다음 일정") + " · " + esc(i.start) + (i.end ? "~" + esc(i.end) : "") + "</small><b>" + esc(i.title) + "</b>" + (i.place ? "<small>📍 " + esc(i.place) + "</small>" : "") + "</div>";
  }

  function render() {
    renderHead(); renderTabs();
    var html = "";
    if (view === "map") {
      $("view").innerHTML = mapHtml();
      setupMap();
      return;
    }
    if (view === "notice") {
      html += nowBanner();
      html += appNoteHtml();
      html += D.notes.length ? '<div class="notes">' + D.notes.map(noteHtml).join("") + "</div>" : '<div class="empty">아직 공지가 없습니다.</div>';
    } else {
      var d = +view.slice(1), list = D.items.filter(function (i) { return i.day === d; }), nx = nextItem();
      var isToday = todayDay() === d;
      if (isToday) html += nowBanner();
      html += '<h2 class="sec-h">' + esc(dayLabel(d)) + (isToday && !inExtra() ? '<span class="today-tag">오늘</span>' : "") + "</h2>";
      html += '<ol class="tl">' + list.map(function (i) { return itemHtml(i, nx); }).join("") + "</ol>";
    }
    $("view").innerHTML = html;
    var cur = document.querySelector(".it.cur") || document.querySelector(".it.next");
    if (cur && view !== "notice" && !render.scrolled) { render.scrolled = true; cur.scrollIntoView({ block: "center" }); }
  }

  /* ── 지도 ──────────────────────────────────────────
     지도 그림을 바꾸려면 같은 이름(김장대첩지도.PNG)으로 덮어 올리면 됩니다.
     파일 이름이 다르면 아래 MAP_SRC 글자만 바꾸세요. (대소문자까지 똑같아야 합니다) */
  var MAP_SRC = "김장대첩지도.png";
  var MAP_ALT = "김장대첩지도.PNG"; /* 위 이름으로 못 찾으면 이 이름으로 한 번 더 찾아봄 */

  /* 지도 범례: 같은 색 = 같은 리워드를 주는 미션. m 은 동그라미를 누르면 팝업으로 뜨는 미션 이름입니다 */
  /* img 는 팝업 카드에 뜨는 미션 이미지 파일 이름입니다 (같은 저장소에 올려 주세요).
     .jpg 가 없으면 같은 이름의 .png 를 찾고, 둘 다 없으면 '이미지 준비 중' 카드가 뜹니다. 세로 3:4 비율(예: 900×1200)을 권장해요 */
  var MAP_LEGEND = [
    { c: "#2F6FE4", n: "파란색", m: "배추 일병 구하기", img: "mission_blue.jpg" },
    { c: "#E23B3B", n: "빨간색", m: "손에 손잡고", img: "mission_red.jpg" },
    { c: "#F28C28", n: "주황색", m: "너마늘 사랑한다했잖아", img: "mission_orange.jpg" },
    { c: "#8E4EC6", n: "보라색", m: "발목에 걸리는건 죄가 아니잖아!", img: "mission_purple.jpg" },
    { c: "#F2C81E", n: "노란색", m: "네땅도 내땅, 내땅도 내땅", img: "mission_yellow.jpg" }
  ];
  /* 특별 리워드 줄: e 는 이모티콘, m 은 누르면 팝업에 뜨는 미션 이름. 무는 휴대폰에 이모티콘이 없어 그림(MU_SVG)으로 넣었습니다, d 는 미션 이름 아래 설명(없으면 안 보임) */
  var MU_SVG = '<svg class="svgemo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.500C10 4.500 7 3.500 5 4.500c1 2.200 3.200 3.800 6.500 3.600zM11.800 7.500c-.3-3 .9-5.300 3-6.300 1 2.200 0 5-2.200 6.800zM12.500 7.800c2-2.200 5-3 7-2-1.200 2.200-4 3.600-7 2.800z" fill="#4CAF50"/><path d="M8 8.800c2-1.500 6-1.500 8 0 1.500 2 .5 6.800-1.500 10.200-1 1.800-1.900 3.500-2.500 3.500s-1.500-1.700-2.500-3.500C7.500 15.600 6.500 10.800 8 8.800z" fill="#FFFDF5" stroke="#A9A38F" stroke-width="1"/></svg>';
  var MAP_SPECIAL = [
    { e: "🌶️", n: "고추", m: '힐록에 가서 "사장님 김치추가" 주문해 보세요. 숨은미션이 나올지도~', img: "mission_pepper.jpg" },
    { e: "🫚", n: "생강", m: "생강 헤는 밤", img: "mission_ginger.jpg" },
    { h: MU_SVG, n: "무", m: "쇼미 더 김치", img: "mission_radish.jpg" },
    { e: "🧅", n: "양파", m: "너의 목소리가 보여", img: "mission_onion.jpg" },
    { e: "🥬", n: "배추", m: "김치맨을 찾아라!", d: "무주시내를 누비는 김치맨을 찾으신다면 당신은 행운아!", img: "mission_cabbage.jpg" }
  ];
  function emoHtml(s) { return '<span class="emo">' + (s.h || esc(s.e)) + "</span>"; }
  var MAP_LEGEND_TIP ="*이모티콘을 눌러보세요.";
  var MAP_LEGEND_SPECIAL = "특별 리워드"; /* 배추 이모티콘 옆 글자 */
  var MAP_LEGEND_CAP ="같은 색 미션은 같은 리워드를 드려요";

  function mapHtml() {
    var src = encodeURI(MAP_SRC);
    return '<div class="map" id="map">' +
      '<img id="mapimg" src="' + src + '?v=1" alt="김장대첩 행사장 지도" draggable="false">' +
      '<div class="map-hint" id="maphint">두 손가락으로 확대 · 끌어서 이동</div>' +
      '<div class="map-ctl"><button type="button" data-z="in" aria-label="확대">+</button>' +
      '<button type="button" data-z="out" aria-label="축소">−</button>' +
      '<button type="button" data-z="fit" aria-label="전체 보기">⤢</button></div></div>' +
      '<div class="map-legend" role="group" id="maplegend" aria-label="지도 범례"><div class="row"><span class="dots">' + MAP_LEGEND.map(function (l, k) {
        return '<button type="button" class="lg" data-lg="' + k + '" aria-label="' + esc(l.n) + ' 미션 보기"><i class="dot" style="background:' + l.c + '"></i></button>';
      }).join("") + '</span><span class="cap">' + esc(MAP_LEGEND_CAP) + '</span></div>' +
      '<div class="row"><span class="dots">' + MAP_SPECIAL.map(function (s, k) {
        return '<button type="button" class="lg lgs" data-lg="s' + k + '" aria-label="' + esc(s.n) + ' 미션 보기">' + emoHtml(s) + "</button>";
      }).join("") + '</span><span class="cap">' + esc(MAP_LEGEND_SPECIAL) + "</span></div>" +
      '<span class="tip">' + esc(MAP_LEGEND_TIP) + "</span></div>" +
      '<div class="map-pop-bg" id="mappopbg" hidden></div><div class="map-pop" id="mappop" role="dialog" aria-live="polite" hidden></div>' +
      '<p class="map-sub">잘 안 보이면 <a href="' + src + '" target="_blank" rel="noopener">지도 원본 이미지 열기</a></p>';
  }

  /* 범례 동그라미를 누르면 미션 이름 팝업 · 화면 아무 곳이나 누르면 닫힘 */
  function hideMapPop() { var p = $("mappop"), bg = $("mappopbg"); if (p) p.hidden = true; if (bg) bg.hidden = true; }
  /* 이미지가 .jpg 로 없으면 .png 로 한 번 더 찾고, 그래도 없으면 '준비 중' 표시 */
  window.kjPopImgErr = function (img) {
    var alt = img.getAttribute("data-alt");
    if (alt) { img.removeAttribute("data-alt"); img.src = alt; return; }
    img.remove();
  };
  document.addEventListener("pointerdown", hideMapPop, true);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideMapPop(); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-lg]"), p = $("mappop"), lg = $("maplegend");
    if (!b || !p || !lg) return;
    var id = b.getAttribute("data-lg"), sp = id.charAt(0) === "s", l = sp ? MAP_SPECIAL[+id.slice(1)] : MAP_LEGEND[+id], r = lg.getBoundingClientRect();
    if (!l) return;
    var icon = sp ? emoHtml(l) : '<i class="dot" style="background:' + l.c + '"></i>';
    var img = "";
    if (l.img) {
      var src = encodeURI(l.img), png = /\.jpe?g$/i.test(l.img) ? encodeURI(l.img.replace(/\.jpe?g$/i, ".png")) : "";
      img = '<img src="' + src + '" alt="' + esc(l.m) + '"' + (png ? ' data-alt="' + png + '"' : "") + ' onerror="kjPopImgErr(this)">';
    }
    p.innerHTML = '<div class="pimg"><div class="ph"><span class="big">' + icon + "</span>미션 이미지 준비 중</div>" + img + "</div>" +
      '<div class="pcap">' + icon + "<span>" + esc(l.m) + "</span></div>" +
      (l.d ? '<p class="pdesc">' + esc(l.d) + "</p>" : "") +
      '<div class="pclose">화면 아무 곳이나 누르면 닫혀요</div>';
    p.hidden = false; var bg = $("mappopbg"); if (bg) bg.hidden = false;
  });
  function setupMap() {
    var box = $("map"), img = $("mapimg"), hint = $("maphint");
    var W = 0, H = 0, iw = 0, ih = 0, minS = 1, maxS = 4, s = 1, x = 0, y = 0;
    var pts = {}, last = null, lastTap = 0;

    function size() { W = box.clientWidth; H = box.clientHeight; }
    function clamp() {
      s = Math.min(maxS, Math.max(minS, s));
      var w = iw * s, h = ih * s;
      x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, x));
      y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, y));
    }
    function draw(anim) {
      clamp();
      img.style.transition = anim ? "transform .25s ease" : "none";
      img.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
    }
    /* (cx, cy) 지점을 기준으로 배율 바꾸기 */
    function zoomAt(ns, cx, cy, anim) {
      ns = Math.min(maxS, Math.max(minS, ns));
      x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; draw(anim);
    }
    /* 처음 화면: 세로를 꽉 채워서 좌우로 밀어 볼 수 있게 (가로가 긴 지도 기준) */
    function start() {
      size(); iw = img.naturalWidth; ih = img.naturalHeight;
      minS = Math.min(W / iw, H / ih);                 // 전체가 한눈에 보이는 배율
      var cover = Math.max(W / iw, H / ih);            // 화면을 꽉 채우는 배율
      maxS = Math.max(cover * 4, 2);
      s = cover; x = (W - iw * s) / 2; y = (H - ih * s) / 2;
      draw(false); box.classList.add("ready");
    }
    function fitToggle() {
      var cover = Math.max(W / iw, H / ih);
      var ns = s > minS * 1.01 ? minS : cover;
      zoomAt(ns, W / 2, H / 2, true);
    }

    if (img.complete && img.naturalWidth) start(); else img.addEventListener("load", start);
    var triedAlt = false;
    img.addEventListener("error", function () {
      if (!triedAlt && MAP_ALT) { triedAlt = true; img.src = encodeURI(MAP_ALT) + "?v=1"; return; }
      box.innerHTML = '<div class="map-err">지도 이미지(' + esc(MAP_SRC) + ')를 찾을 수 없습니다.<br>저장소에 같은 이름으로 올라가 있는지 확인해 주세요.</div>';
    });
    setTimeout(function () { hint && hint.classList.add("off"); }, 3500);

    function rel(e) { var r = box.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function pair() {
      var k = Object.keys(pts); if (k.length < 2) return null;
      var a = pts[k[0]], b = pts[k[1]];
      return { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) };
    }

    box.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".map-ctl") || !iw) return;
      box.setPointerCapture(e.pointerId);
      pts[e.pointerId] = rel(e); last = pair() || pts[e.pointerId];
      box.classList.add("drag"); hint && hint.classList.add("off");
      /* 두 번 탭: 그 자리 확대 / 이미 크게 보고 있으면 전체 보기 */
      if (Object.keys(pts).length === 1) {
        var now = Date.now(), p = pts[e.pointerId];
        if (now - lastTap < 300) { zoomAt(s < minS * 2.2 ? s * 2.2 : minS, p.x, p.y, true); lastTap = 0; }
        else lastTap = now;
      }
    });
    box.addEventListener("pointermove", function (e) {
      if (!pts[e.pointerId]) return;
      pts[e.pointerId] = rel(e);
      var p = pair();
      if (p && last && last.d) {             // 두 손가락: 확대/축소 + 이동
        var ns = Math.min(maxS, Math.max(minS, s * p.d / last.d));
        x = p.cx - (last.cx - x) * ns / s; y = p.cy - (last.cy - y) * ns / s; s = ns;
        draw(false); last = p;
      } else if (!p && last) {              // 한 손가락: 끌어서 이동
        var c = pts[e.pointerId];
        x += c.x - last.x; y += c.y - last.y; draw(false); last = c;
      }
    });
    function up(e) {
      delete pts[e.pointerId];
      var k = Object.keys(pts);
      last = k.length ? pts[k[0]] : null;
      if (!k.length) box.classList.remove("drag");
    }
    box.addEventListener("pointerup", up);
    box.addEventListener("pointercancel", up);

    /* PC: 마우스 휠로 확대 */
    box.addEventListener("wheel", function (e) {
      if (!iw) return; e.preventDefault();
      var p = rel(e); zoomAt(s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), p.x, p.y, false);
    }, { passive: false });

    box.querySelector(".map-ctl").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b || !iw) return;
      var z = b.dataset.z;
      if (z === "in") zoomAt(s * 1.6, W / 2, H / 2, true);
      else if (z === "out") zoomAt(s / 1.6, W / 2, H / 2, true);
      else fitToggle();
    });

    /* 화면 회전·크기 변경 시 다시 맞추기 */
    function onResize() { if (!document.body.contains(box)) { removeEventListener("resize", onResize); return; } if (iw) start(); }
    addEventListener("resize", onResize);
  }

  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".tab"); if (!b) return;
    view = b.dataset.v; try { history.replaceState(null, "", "#" + view); } catch (x) {}
    render(); window.scrollTo({ top: document.querySelector(".bar").offsetTop, behavior: "smooth" });
  });

  $("view").addEventListener("click", function (e) {
    var os = e.target.closest("[data-os]"); if (os) { appOs = os.dataset.os; render(); return; }
    if (e.target.closest("[data-ext]")) { openExternal(); return; }
  });
  /* 안내를 접거나 펼친 상태를 기억 (화면을 새로 그려도 유지) */
  $("view").addEventListener("toggle", function (e) {
    if (e.target.id !== "appnote") return;
    appOpen = e.target.open; try { localStorage.setItem("kj-appnote-closed", appOpen ? "0" : "1"); } catch (x) {}
  }, true);

  /* 처음 열면(새로고침 포함) 행사 당일이어도 항상 공지 탭부터 보여 줍니다 */
  function startView() {
    try { history.replaceState(null, "", location.pathname + location.search); } catch (x) {}
    return "notice";
  }

  function showMsg(t) { $("msg").textContent = t; $("msg").hidden = !t; }

  function boot() {
    if (!window.XLSX || location.protocol === "file:") return Promise.reject(new Error("local"));
    return fetch("schedule.xlsx?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.arrayBuffer(); })
      .then(function (buf) { fromWorkbook(XLSX.read(buf, { type: "array" })); });
  }

  boot().then(function () { showMsg(""); }, function (err) {
    load(FALLBACK.info, FALLBACK.items, FALLBACK.notes);
    showMsg(err && err.message === "local"
      ? "PC에서 파일을 직접 열면 엑셀을 읽지 못해 예비 내용만 보입니다. GitHub 페이지 주소로 열어 주세요."
      : "일정 파일(schedule.xlsx)을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.");
  }).then(function () {
    view = startView();
    $("foot").textContent = "일정은 운영 상황에 따라 바뀔 수 있습니다. 새로고침하면 최신 내용이 보입니다.";
    render();
    setInterval(function () { if (view !== "map") render(); }, 60000); /* 지도 보는 중엔 확대 상태 유지 */
  });
})();
</script>
